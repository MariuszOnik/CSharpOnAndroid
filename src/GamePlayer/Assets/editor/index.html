<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <title>Edytor</title>
  <style>
    [hidden] { display: none !important; }
    html, body { margin: 0; height: 100%; background: #282c34; color: #abb2bf; font-family: sans-serif; }
    body { display: flex; flex-direction: column; }
    button { font-family: inherit; }
    #toolbar { display: flex; align-items: center; gap: 8px; padding: 6px 8px; background: #21252b; }
    #project { max-width: 40%; background: #2c313a; color: #d7dae0; border: 0; border-radius: 6px; padding: 8px 10px; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #play { background: #3a9b4c; color: #fff; border: 0; border-radius: 6px; padding: 8px 16px; font-size: 16px; font-weight: bold; white-space: nowrap; }
    #play:disabled { opacity: .5; }
    #status { flex: 1; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #status.ok { color: #98c379; }
    #status.error { color: #e06c75; }
    #status.muted { color: #7f848e; }
    #tabs { display: flex; overflow-x: auto; background: #1d2026; }
    #tabs button { flex: 0 0 auto; height: 38px; padding: 0 14px; background: none; color: #7f848e; border: 0; border-right: 1px solid #181a1f; font-size: 14px; }
    #tabs button.active { background: #282c34; color: #d7dae0; }
    #tabs button.error { color: #e06c75; }
    .cm-tooltip-autocomplete ul li { padding: 6px 4px !important; font-size: 15px; }
    #editor { flex: 1; min-height: 0; }
    #errors { max-height: 30%; overflow-y: auto; background: #21252b; border-top: 1px solid #181a1f; font-size: 13px; }
    #errors button { display: block; width: 100%; padding: 8px; background: none; color: #e06c75; border: 0; border-bottom: 1px solid #181a1f; text-align: left; font-size: 13px; }
    #errors button.warning { color: #d19a66; }
    #symbols { display: flex; overflow-x: auto; background: #21252b; }
    #symbols button { flex: 0 0 auto; min-width: 40px; height: 40px; background: none; color: #abb2bf; border: 0; border-right: 1px solid #181a1f; font: 18px monospace; }
    #modal { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(0, 0, 0, .6); }
    #dialog { display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 420px; max-height: 80%; overflow-y: auto; box-sizing: border-box; padding: 14px; background: #2c313a; border-radius: 10px; }
    #dialog h2 { margin: 0 0 4px; font-size: 17px; color: #d7dae0; }
    #dialog input { padding: 10px; background: #21252b; color: #d7dae0; border: 1px solid #181a1f; border-radius: 6px; font-size: 16px; }
    #dialog button { padding: 11px; background: #3a404b; color: #d7dae0; border: 0; border-radius: 6px; font-size: 15px; text-align: left; }
    #dialog button.primary { background: #3a9b4c; color: #fff; }
    #dialog button.danger { background: #8c3a40; color: #fff; }
    #helpButton { background: #3a404b; color: #d7dae0; border: 0; border-radius: 6px; padding: 8px 13px; font-size: 16px; font-weight: bold; }
    #help { position: fixed; inset: 0; z-index: 90; display: flex; flex-direction: column; background: #282c34; }
    #helpBar { display: flex; align-items: center; gap: 8px; padding: 6px 8px; background: #21252b; color: #d7dae0; font-size: 16px; }
    #helpBar span { flex: 1; }
    #helpClose { background: #3a404b; color: #d7dae0; border: 0; border-radius: 6px; padding: 8px 14px; font-size: 15px; }
    #helpFrame { flex: 1; width: 100%; border: 0; }
  </style>
</head>
<body>
  <div id="toolbar">
    <button id="project"></button>
    <button id="play">▶ Graj</button>
    <span id="status"></span>
    <button id="helpButton" title="Pomoc">?</button>
  </div>
  <div id="tabs"></div>
  <div id="editor"></div>
  <div id="errors" hidden></div>
  <div id="symbols">
    <button data-insert="    ">⇥</button>
    <button>{</button><button>}</button><button>(</button><button>)</button>
    <button>;</button><button>.</button><button>=</button><button>"</button>
    <button>&lt;</button><button>&gt;</button><button>[</button><button>]</button>
    <button>+</button><button>-</button><button>*</button><button>/</button>
    <button>!</button><button>&amp;</button><button>|</button><button>,</button>
  </div>
  <div id="help" hidden>
    <div id="helpBar"><span>Pomoc</span><button id="helpClose">✕ Zamknij</button></div>
    <iframe id="helpFrame"></iframe>
  </div>
  <div id="modal" hidden><div id="dialog"></div></div>
  <script src="editor.js"></script>
</body>
</html>
