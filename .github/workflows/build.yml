name: Build APK

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    name: APK ${{ matrix.name }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: android-arm64
            name: arm64
          - abi: android-arm
            name: arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Ten sam JDK co lokalnie (17); nowszy systemowy psul narzedzia Androida.
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: 17

      - name: Workload android
        run: dotnet workload install android

      # Doinstalowuje brakujace czesci Android SDK (platforma, build-tools) wymagane przez workload.
      - name: Android SDK
        run: >
          dotnet build src/GamePlayer/GamePlayer.csproj -t:InstallAndroidDependencies
          "-p:ApkAbi=${{ matrix.abi }}"
          "-p:AndroidSdkDirectory=$env:ANDROID_HOME" "-p:JavaSdkDirectory=$env:JAVA_HOME"
          -p:AcceptAndroidSDKLicenses=True -v:minimal

      # ApkAbi zamiast RuntimeIdentifiers - patrz komentarz w GamePlayer.csproj.
      # Staly klucz z sekretow repo: APK z kolejnych buildow da sie instalowac jako aktualizacje.
      # Bez sekretow (np. PR z forka) build podpisuje sie kluczem debugowym.
      - name: Build Release
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          $sign = @()
          if ($env:KEYSTORE_BASE64) {
            $ks = Join-Path $env:RUNNER_TEMP "release.keystore"
            [IO.File]::WriteAllBytes($ks, [Convert]::FromBase64String($env:KEYSTORE_BASE64))
            $sign = "-p:AndroidKeyStore=true", "-p:AndroidSigningKeyStore=$ks",
                    "-p:AndroidSigningKeyAlias=csharpgameplayer",
                    "-p:AndroidSigningStorePass=env:KEYSTORE_PASSWORD", "-p:AndroidSigningKeyPass=env:KEYSTORE_PASSWORD"
            Write-Host "Podpis: klucz z sekretow repo"
          } else {
            Write-Host "::warning::Brak sekretu ANDROID_KEYSTORE_BASE64 - APK podpisany kluczem debugowym"
          }
          dotnet build src/GamePlayer/GamePlayer.csproj -c Release "-p:ApkAbi=${{ matrix.abi }}" "-p:AndroidSdkDirectory=$env:ANDROID_HOME" "-p:JavaSdkDirectory=$env:JAVA_HOME" -v:minimal @sign
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Nazwa APK
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item src/GamePlayer/bin/Release/net10.0-android/GamePlayer.GamePlayer-Signed.apk dist/CsharpGamePlayer-${{ matrix.name }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CsharpGamePlayer-${{ matrix.name }}
          path: dist/*.apk
          if-no-files-found: error
